id: FEATURE
name: New Feature
description: Develop a feature end-to-end, from requirements to delivery.

steps:
  - id: clarify
    name: Clarify requirements
    role: architect
    permission: plan
    system: |
      The user's task below may be written in a language other than English.
      Interpret and process the task in English. Reason, analyze, and produce
      all outputs in English.
    prompt: |
      Task: {{task}}
      Working directory: {{workdir}}

      Clarify the requirements for this feature. Inspect the codebase (read-only),
      list ambiguities and design decisions. Do not write any code yet.

  - id: design
    name: Design
    role: architect
    permission: plan
    prompt: |
      Task: {{task}}
      Requirements: {{context.clarify}}

      Design the feature based on the requirements above.
      Write down the architectural decisions, the data model, and the interface/UI
      approach (if any) in concrete terms.

  - id: plan
    name: Implementation plan
    role: architect
    permission: plan
    prompt: |
      Task: {{task}}
      Design: {{context.design}}

      Write a step-by-step plan to implement the feature.
      Which files will be created/modified and in what order.

  - id: implement
    name: Implementation
    role: coder
    auto: true
    prompt: |
      Task: {{task}}
      Design: {{context.design}}
      Plan: {{context.plan}}

      Implement the feature. Follow the plan. Summarize what you did when done.

  - id: test
    name: Write tests
    role: coder
    auto: true
    prompt: |
      Task: {{task}}
      Changes: {{context.implement}}

      Write the necessary tests for the new feature. Follow the existing test conventions.

  - id: verify
    name: Verification
    role: coder
    auto: true
    prompt: |
      Task: {{task}}
      Changes: {{context.implement}}
      Tests: {{context.test}}

      Run all tests, lint/typecheck/build.
      Report pass or fail with concrete command output.

  - id: report
    name: Report
    role: architect
    permission: plan
    prompt: |
      Task: {{task}}
      Changes: {{context.implement}}
      Verification: {{context.verify}}

      Write a short, clear summary of the delivered feature (to be relayed to the user).
