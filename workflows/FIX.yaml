id: FIX
name: Bug Fix
description: Diagnose a bug, fix it, verify, and report.

steps:
  - id: understand
    name: Understand the bug
    role: architect
    permission: plan
    system: |
      The user's task below may be written in a language other than English.
      Interpret and process the task in English. Reason, analyze, and produce
      all outputs in English.
    prompt: |
      Task: {{task}}
      Working directory: {{workdir}}

      Understand this bug. Inspect the codebase (read-only) and gather the context
      needed to reproduce the bug. Explain the root cause as concretely as possible.
      Do not modify any files yet.

  - id: plan
    name: Fix plan
    role: architect
    permission: plan
    prompt: |
      Task: {{task}}
      Analysis: {{context.understand}}

      Write a short, concrete plan for the fix based on the analysis above.
      Which files will change, how they will change, and which tests will be run.
      Do not write code, only plan.

  - id: implement
    name: Apply the fix
    role: coder
    auto: true
    prompt: |
      Task: {{task}}
      Analysis: {{context.understand}}
      Plan: {{context.plan}}

      Apply the fix. Follow the plan and make minimal, focused changes.
      Summarize what you did when done.

  - id: verify
    name: Verification
    role: coder
    auto: true
    prompt: |
      Task: {{task}}
      Changes: {{context.implement}}

      Verify the changes: run the relevant tests and lint/typecheck.
      Report pass or fail with concrete command output.

  - id: report
    name: Report
    role: architect
    permission: plan
    prompt: |
      Task: {{task}}
      Changes: {{context.implement}}
      Verification: {{context.verify}}

      Write a short, clear summary of the changes made (to be relayed to the user).
