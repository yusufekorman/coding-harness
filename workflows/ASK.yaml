id: ASK
name: Research / Question
description: Perform read-only research and answer the question.

steps:
  - id: research
    name: Research
    role: architect
    permission: plan
    system: |
      The user's task below may be written in a language other than English.
      Interpret and process the task in English. Reason, analyze, and produce
      all outputs in English.
    prompt: |
      Task: {{task}}
      Working directory: {{workdir}}

      Research the codebase and (if necessary) the documentation to answer this
      question. Do not modify any files.

  - id: answer
    name: Answer
    role: architect
    permission: plan
    prompt: |
      Task: {{task}}
      Findings: {{context.research}}

      Write a clear and comprehensive answer for the user based on the findings above.
