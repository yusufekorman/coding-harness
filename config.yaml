# Role -> model -> effort resolution matrix.
# role: orchestrator (decisions), architect (architecture/UI), coder (writing code)
# tool: opencode | claude | antigravity
# for claude: effort  -> --effort (low|medium|high|xhigh|max)
# for opencode: variant -> --variant (minimal|low|medium|high|max)
# for antigravity: effort -> --effort (low|medium|high); model -> a slug from `agy models`
#   (e.g. gemini-3.7-flash-high, gemini-3.1-pro-high, claude-sonnet-4-6).
#   antigravity write/`auto` steps auto-approve tools (--dangerously-skip-permissions);
#   read/plan steps enforce `permissions` below (allow/deny deterministically, "ask" -> orchestrator).

defaultEffort: medium
maxRetries: 3
maxTransientRetries: 3
transientBackoffMs: 2000

safety:
  # false: every permission category becomes "ask" (nothing is auto-approved)
  autoApprove: true
  # directories where write-capable steps are blocked ($HOME is only protected on an exact match)
  protectedDirs:
    - $HOME
    - /
    - /etc
    - /usr
    - /bin
    - /boot
    - /dev
    - /lib
    - /proc
    - /sys

# opencode per-category permission policy: allow (automatic) | ask (orchestrator/user) | deny
permissions:
  read: allow
  edit: allow
  grep: allow
  glob: allow
  list: allow
  lsp: allow
  webfetch: allow
  websearch: allow
  codesearch: allow
  bash: ask
  task: allow
  external_directory: ask
  todowrite: ask
  doom_loop: deny
  question: ask

efforts:
  medium:
    orchestrator:
      tool: opencode
      model: opencode-go/deepseek-v4-flash
      variant: medium
    architect:
      tool: claude
      model: sonnet
      effort: high
    coder:
      tool: opencode
      model: opencode-go/deepseek-v4-pro
      variant: medium

  high:
    orchestrator:
      tool: opencode
      model: opencode-go/deepseek-v4-flash
      variant: high
    architect:
      tool: claude
      model: opus
      effort: medium
    coder:
      tool: opencode
      model: opencode-go/deepseek-v4-pro
      variant: high
